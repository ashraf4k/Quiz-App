<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        
        <div class="screen active" id="start-screen">
            <h1>Quiz Time!</h1>
            <p>Test your Knowledge with few questions</p>
            <button id="start-btn">Start Quiz</button>
        </div>


        <div class="screen" id="quiz-screen">
            <div class="quiz-header">
                <div class="timer">
            Time left: <span id="time-left">15</span>s
        </div>
                <h2 id="question-text">questions</h2>
                <div class="quiz-info">
                    <p>
                    question <span id="current-question">1</span> of <span id="total-questions">5</span>
                    </p>

                    <p>
                        Score: <span id="score">0</span>
                    </p>
                </div>
            </div>

            <div id="answers-container" class="answers-container">
                <!--Answers buttons will be right here from js code-->
            </div>

            <div class="progress-bar">
                <div id="progress" class="progress"></div>
            </div>
        </div>

        <div id="result-screen" class="screen">
            <h1>Quiz results</h1>
            <div class="result-info">
                <p>You scored <span id="final-score">0</span> out of <span id="maximum-score">5</span></p>
                <div id="result-message">Good job!</div>
            </div>
            <button id="restart-btn">Restart Quiz</button>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
